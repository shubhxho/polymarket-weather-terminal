[package]
name = "polymarket-weather-terminal"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UI framework - using eframe which bundles everything correctly
eframe = { version = "0.29", features = ["wgpu"] }
egui = "0.29"
egui_plot = "0.29"
wgpu = { version = "22.0", features = ["wgsl"] }
bytemuck = { version = "1.14", features = ["derive"] }

# Data processing
statrs = "0.17"

[dev-dependencies]
approx = "0.5"
